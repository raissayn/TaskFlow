services:
  taskflow-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/data/taskflow.db
      - Jwt__Secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_IN_PRODUCTION_1234567890
      - Jwt__Issuer=TaskFlow.Api
      - Jwt__Audience=TaskFlow.Client
    volumes:
      - taskflow-data:/data

volumes:
  taskflow-data:
